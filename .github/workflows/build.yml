name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: cp node_modules/jszip/dist/jszip.min.js www/jszip.min.js
      - run: cp node_modules/pdfjs-dist/build/pdf.min.js www/pdf.min.js && cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/pdf.worker.min.js
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-reader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
