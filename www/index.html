<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f4ec">
<title>Leaf Reader</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="paper">

<main id="libraryView" class="view">
  <div class="titlebar">
    <h1>Library</h1>
    <div class="tb-actions">
      <button class="round" id="addBtn" aria-label="Add"><span data-ic="plus"></span></button>
    </div>
  </div>
  <div class="search"><span data-ic="search"></span><input id="search" type="search" placeholder="Search titles and text"></div>
  <div class="segmented" id="tabs">
    <button data-tab="all" class="on">All</button>
    <button data-tab="reading">Reading</button>
    <button data-tab="finished">Finished</button>
  </div>
  <div class="chips" id="kinds">
    <button data-kind="all" class="on">Everything</button>
    <button data-kind="book">Books</button>
    <button data-kind="article">Articles</button>
    <button data-kind="document">Documents</button>
    <button id="sortBtn" class="ghost">Recent</button>
  </div>
  <div id="hero"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <div class="empty-leaf" data-ic="leaf"></div>
    <h2>Your shelf is empty</h2>
    <p>Add an EPUB, a PDF, a text file or a web link. Everything stays on this phone.</p>
    <button class="primary" id="emptyAdd">Add your first book</button>
  </div>
</main>

<main id="highlightsView" class="view" hidden>
  <div class="titlebar"><h1>Highlights</h1></div>
  <div id="hlList"></div>
</main>

<main id="settingsView" class="view" hidden>
  <div class="titlebar"><h1>Settings</h1></div>
  <div id="settingsBody"></div>
</main>

<nav id="tabbar">
  <button data-view="library" class="on"><span data-ic="book"></span><i>Library</i></button>
  <button data-view="highlights"><span data-ic="marker"></span><i>Highlights</i></button>
  <button data-view="settings"><span data-ic="sliders"></span><i>Settings</i></button>
</nav>

<section id="reader">
  <div class="topbar">
    <button class="round flat" id="back" aria-label="Back"><span data-ic="back"></span></button>
    <span id="rtitle"></span>
    <button class="round flat" id="rshare" aria-label="Share"><span data-ic="share"></span></button>
    <button class="round flat" id="gear" aria-label="Reading settings"><b>Aa</b></button>
  </div>
  <div id="page"><div id="content"></div></div>
  <div id="pdfStage" class="pdfstage" hidden></div>
  <div id="flipfx"></div>
  <div id="pageinfo"></div>
  <div class="bottombar">
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <span id="pct">0%</span>
  </div>
  <div id="selbar" hidden>
    <button id="hlBtn"><span data-ic="marker"></span>Highlight</button>
    <button id="quoteBtn"><span data-ic="share"></span>Share</button>
  </div>
</section>

<div id="backdrop"><div id="sheet"></div></div>
<div id="toast"></div>
<input id="fileInput" type="file" accept=".epub,.pdf,.txt,.text,.md" hidden>
<input id="backupInput" type="file" accept=".json,application/json" hidden>

<div id="dim"></div><div id="warm"></div><div id="grainLayer"></div>
<script src="jszip.min.js"></script>
<script src="pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
